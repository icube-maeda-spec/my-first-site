<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>只今システムメンテナンス中です</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 10s linear infinite',
            'spin-reverse': 'spin-reverse 12s linear infinite',
          },
          keyframes: {
            'spin-reverse': {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(-360deg)' },
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Background Ambient Glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Container -->
  <main class="w-full max-w-xl mx-auto flex flex-col items-center text-center z-10">
    
    <!-- Animated Rotating Logo / Gear Icon -->
    <div class="relative w-28 h-28 mb-10 flex items-center justify-center">
      <!-- Outer Rotating Gear -->
      <i class="fa-solid fa-gear text-slate-800 text-6xl absolute animate-spin-slow"></i>
      <!-- Inner Reverse Rotating Gear -->
      <i class="fa-solid fa-gear text-indigo-500 text-4xl absolute animate-spin-reverse drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"></i>
      <!-- Center Icon -->
      <div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center z-10 border border-slate-700/60 shadow-inner">
        <i class="fa-solid fa-screwdriver-wrench text-indigo-200 text-sm"></i>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-white mb-6">
      只今システムメンテナンス中です
    </h1>

    <!-- Text Body -->
    <p class="text-slate-300 text-sm sm:text-base leading-relaxed whitespace-pre-line font-normal">
いつもご利用いただき誠にありがとうございます。
サービスの利便性向上およびシステムの安定化のため、現在定期メンテナンスを実施しております。
ご不便をおかけいたしますが、ご理解とご協力のほどお願い申し上げます。
    </p>

  </main>

</body>
</html>
